# Build the site and publish it to Hostinger over FTP.
#
# Hostinger's own Git integration only clones a repository — it cannot run a
# build. This site is generated by build.js, so a plain clone would upload the
# source and none of the 74 pages. This builds first, then uploads the output.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST      e.g. ftp.pgcountyautorepair.com  (hPanel -> Files -> FTP Accounts)
#   FTP_USER      the FTP username from that page
#   FTP_PASSWORD  that account's password
#
# The GitHub Pages copy is unaffected; it still builds from the repo root.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

concurrency:
  # Never let two deploys write to the same directory at once.
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build for pgcountyautorepair.com
        run: npm run build:hostinger

      - name: Verify the build before uploading
        run: |
          # A build carrying the GitHub subpath would 404 every link on the
          # domain. Cheaper to fail here than to serve a broken site.
          if grep -rq "YBE-Auto-Repair-Center" dist-hostinger/; then
            echo "::error::GitHub subpath found in the Hostinger build"
            exit 1
          fi
          test -f dist-hostinger/index.html
          test -f dist-hostinger/.htaccess
          echo "$(find dist-hostinger -type f | wc -l) files ready"

      - name: Upload to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist-hostinger/
          server-dir: public_html/
          # Only changed files are transferred; the action keeps a state file
          # on the server to work that out. Nothing on the server is deleted
          # that the build does not replace.
          exclude: |
            **/.git*
            **/.git*/**
